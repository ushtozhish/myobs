name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Engine from cache
        id: engine
        uses: actions/cache@v4
        with:
          path: |
            engine-build/install
            engine-build/deps
          key: engine-${{ hashFiles('engine/OBS_VERSION', 'engine/patches/**', 'ci/build-engine.ps1') }}

      - name: Build engine (OBS core, once per engine change)
        if: steps.engine.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/build-engine.ps1

      - name: Build MyOBS
        shell: pwsh
        run: ./ci/build-app.ps1

      - name: Automatic tests
        shell: pwsh
        run: ./ci/run-tests.ps1

      - name: Demo screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'screenshots'
          $exe = Join-Path $PWD 'runtime/bin/64bit/myobs.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--demo-screenshots', "`"$out`"" -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'demo timed out' }
          Get-ChildItem $out -ErrorAction SilentlyContinue | Format-Table Name, Length
          $log = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'MyOBS/logs') -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) { Get-Content $log.FullName | Select-Object -Last 40 }

      - name: Publish screenshots to the screenshots branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots/1_work.png)) { Write-Host 'no screenshots'; exit 0 }
          Set-Location screenshots
          git init -q -b screenshots
          git config user.name 'myobs-ci'
          git config user.email 'myobs-ci@users.noreply.github.com'
          git add *.png
          git commit -q -m "Screenshots of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload MyOBS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myobs-windows
          path: runtime/
          retention-days: 7
          if-no-files-found: ignore
